      '<div class="caixa"><h3>Teste justo: prever o ano 2 só com o ano 1 (MAPE)</h3><div class="graf" style="height:260px"><canvas id="c7"></canvas></div><p class="destaque" style="margin:10px 0 0;font-size:16px">Sazonal: ' + dec(val('TOTAL_Q', 'Sazonal (índices do ano 1)').mape, 0) + '% de erro na empresa, contra 66% a 81% dos demais.</p></div></div>'},
    {titulo: 'Curva ABC', olho: 'Curva ABC · critério: faturamento 12 meses', site: 'fdc-abc', html:
      '<div class="corpo c3-2"><div class="caixa"><h3>Pareto dos 10 produtos</h3><div class="graf" style="height:360px"><canvas id="c8"></canvas></div></div>' +
      '<div><table><tr><th>Ref.</th><th class="n">%</th><th class="n">Acum.</th><th></th></tr>' + abcR.map(function (r) { return '<tr><td>' + r.ref + '</td><td class="n">' + dec(r.pct, 1) + '</td><td class="n">' + dec(r.acum, 1) + '</td><td><span class="selo s' + r.classe + '">' + r.classe + '</span></td></tr>'; }).join('') + '</table>' +
      '<p class="destaque" style="margin-top:14px;font-size:16px">No portfólio inteiro, ' + int(a80) + ' de ' + int(n12) + ' referências (' + dec(a80 / n12 * 100, 0) + '%) fazem 80% do faturamento.</p></div></div>'},
    {titulo: 'Ponto de pedido', olho: 'Ponto de pedido · nível de serviço 95%', site: 'fdc-pp', html:
      '<div class="form" style="font-size:26px">PP = D × LT + ES &nbsp; · &nbsp; ES = Z·√(LT·σd² + D²·σLT²)<small>D em pares/dia corrido · LT em dias corridos (pedido → nota) · Z = 1,65</small></div>' +
      '<div class="corpo c2" style="gap:20px"><div class="caixa" style="padding:12px 16px"><table><tr><th>Ref.</th><th class="n">D/dia</th><th class="n">LT</th><th class="n">ES</th><th class="n">PP</th><th class="n">Dias</th></tr>' +
      ppR.map(function (r) { return '<tr><td>' + r.ref + '</td><td class="n">' + dec(r['d (pares/dia)'], 1) + '</td><td class="n">' + r['LT médio (dias)'] + '</td><td class="n">' + int(r['ES demanda + LT']) + '</td><td class="n"><b>' + int(r['PP = d×LT + ES']) + '</b></td><td class="n">' + r['Cobertura do PP (dias)'] + '</td></tr>'; }).join('') + '</table></div>' +
      '<div class="caixa"><h3>D × LT + estoque de segurança (pares)</h3><div class="graf" style="height:300px"><canvas id="c9"></canvas></div></div></div>'},
    {titulo: 'Recomendações gerenciais', olho: 'Achados e recomendações', site: 'fdc-conclusao', html:
      '<ol class="passos"><li><b>Prever por família, com sazonalidade,</b> e repartir pelo mix da coleção (vale para empresa e rasteiras, 70% dos pares). Por referência, nenhum método acerta: a vida do modelo é curta.</li>' +
      '<li><b>Nivelar a produção</b> perto de 60 mil pares/mês, formando estoque de antecipação antes do pico de ago–nov.</li>' +
      '<li><b>Ponto de pedido para matéria-prima comum</b> (solado, palmilha, tiras, caixa), não para produto acabado: o PP de produto daria 4 a 6 meses de venda parada.</li>' +
      '<li><b>Reduzir a variação do prazo</b> (± 27 dias): no nível de família e insumo, pesa mais no estoque de segurança que a variação da venda.</li>' +
      '<li><b>Revisar a cauda C</b>: quase 500 referências somam 5% do faturamento.</li></ol>'},
    {titulo: 'Conclusão', olho: 'Conclusão', site: 'fdc-conclusao', html:
      '<div class="corpo c2"><div><ul class="l"><li>As três ferramentas funcionaram com dados reais. A forma certa de aplicá-las <b>dependeu do negócio</b>.</li><li>Numa fábrica de moda sob pedido: <b>previsão no agregado</b> com sazonalidade, <b>ABC para o mix</b> e <b>PP para insumos e capacidade</b>.</li>' +
      '<li>Limitação: sem estoque e ruptura (não há estoque de acabado); prazo medido inclui a fila de produção.</li></ul></div>' +
      '<div class="caixa" style="align-self:start"><h3>Além do pedido</h3><p style="font-size:17px;line-height:1.5;margin:0 0 12px">O trabalho virou um painel interno da empresa, que se atualiza sozinho pela API do ERP e aplica estes cálculos a todas as 1.442 referências: matriz ABC × XYZ, produção nivelada, plano por numeração, prazo e clientes.</p>' +
      '<p style="font-size:17px;margin:0"><a href="index.html#logistica" style="color:var(--vinho);font-weight:700">Ver o aprofundamento no site →</a></p></div></div>'}
  ];
  function n(r, v, e) { return '<div><small>' + r + '</small><b>' + v + '</b><span>' + e + '</span></div>'; }

  var palco = document.getElementById('palco'), atual = 0, feitos = {};
  palco.innerHTML = S.map(function (s, i) {
    return '<section class="slide ' + (s.cls || '') + '" id="s' + (i + 1) + '">' + (s.titulo ? '<div class="olho">' + s.olho + '</div><h2>' + s.titulo + '</h2><div style="height:18px"></div>' : '') + s.html +
      '<div class="rodape"><span>Giovanna Dias · Logística Empresarial · FDC</span><span>' + (s.site ? '<a href="index.html#' + s.site + '">Ver no site →</a> · ' : '<a href="index.html">Abrir o site →</a> · ') + (i + 1) + ' / ' + S.length + '</span></div></section>';
  }).join('');

  Chart.defaults.font.family = 'Inter'; Chart.defaults.color = '#5A4A44'; Chart.defaults.animation = false;
  function g(id, cfg) { var el = document.getElementById(id); if (!el) return; cfg.options = Object.assign({responsive: true, maintainAspectRatio: false, plugins: {legend: {labels: {boxWidth: 12}}}}, cfg.options || {}); new Chart(el, cfg); }
  var rot = E.meses.concat(['próximo']).map(mes);
  function linhas(chs) { return [{label: 'Vendido', data: E.real, borderColor: COR.tinta, backgroundColor: COR.tinta, borderWidth: 3, pointRadius: 2, tension: .2}].concat(chs.map(function (k) {
    return {label: FDC.metodos[k], data: E.prev[k], borderColor: CORM[k], backgroundColor: CORM[k], borderDash: [6, 4], borderWidth: 2, pointRadius: 0, tension: .2, spanGaps: true}; })); }
  var GR = {
    3: function () { g('c3', {type: 'bar', data: {labels: E.meses.map(mes), datasets: [{label: 'Pares', data: E.real, backgroundColor: E.real.map(function (x, i) { return i < 12 ? COR.areia : COR.vinho; })}]}, options: {plugins: {legend: {display: false}}}}); },
    4: function () { g('c4', {type: 'line', data: {labels: rot, datasets: linhas(['mm3', 'mmp3'])}}); },
    5: function () { g('c5', {type: 'line', data: {labels: rot, datasets: linhas(['ses', 'holt'])}}); },
    6: function () { var sz = FDC.sazonalidade; g('c6a', {type: 'bar', data: {labels: sz.meses, datasets: [{data: sz.indice, backgroundColor: sz.indice.map(function (x) { return x >= 1 ? COR.vinho : COR.areia; })}]}, options: {plugins: {legend: {display: false}}}}); },
    7: function () { var ms = []; FDC.validacao.forEach(function (r) { if (ms.indexOf(r.metodo) < 0) ms.push(r.metodo); }); var cs = [COR.roxo, COR.ocre, COR.claro, COR.azul, COR.verde, COR.vinho];
      g('c7', {type: 'bar', data: {labels: ['Empresa', 'Rasteiras', 'Sandálias', 'Birkens'], datasets: ms.map(function (m, j) { return {label: m.replace(' (índices do ano 1)', ''), backgroundColor: cs[j], data: ['TOTAL_Q', 'FAM_RAST', 'FAM_SAND', 'FAM_BIRK'].map(function (s) { return val(s, m).mape; })}; })},
        options: {plugins: {legend: {labels: {boxWidth: 10, font: {size: 11}}}}, scales: {y: {ticks: {callback: function (x) { return x + '%'; }}}}}}); },
    8: function () { var cc = {A: COR.vinho, B: COR.ocre, C: COR.areia}; g('c8', {type: 'bar', data: {labels: abcR.map(function (r) { return r.ref; }), datasets: [
      {type: 'line', label: '% acumulado', data: abcR.map(function (r) { return r.acum; }), yAxisID: 'y2', borderColor: COR.tinta, backgroundColor: COR.tinta, borderWidth: 2.5, pointRadius: 4},
      {type: 'line', label: '80%', data: abcR.map(function () { return 80; }), yAxisID: 'y2', borderColor: '#8A7A73', borderDash: [4, 4], borderWidth: 1, pointRadius: 0},
      {label: 'Faturamento', data: abcR.map(function (r) { return r.valor; }), backgroundColor: abcR.map(function (r) { return cc[r.classe]; })}]},
      options: {scales: {y: {ticks: {callback: function (x) { return int(x / 1000) + ' mil'; }}}, y2: {position: 'right', min: 0, max: 100, grid: {display: false}, ticks: {callback: function (x) { return x + '%'; }}}}}}); },
    9: function () { g('c9', {type: 'bar', data: {labels: ppR.map(function (r) { return r.ref; }), datasets: [
      {label: 'D × LT', data: ppR.map(function (r) { return Math.round(r['PP = d×LT + ES'] - r['ES demanda + LT']); }), backgroundColor: COR.ocre, stack: 's'},
      {label: 'Estoque de segurança', data: ppR.map(function (r) { return r['ES demanda + LT']; }), backgroundColor: COR.vinho, stack: 's'}]}, options: {scales: {x: {stacked: true}, y: {stacked: true}}}}); }
  };
  function escala() { var k = Math.min(window.innerWidth / 1280, (window.innerHeight - 56) / 720); document.querySelectorAll('.slide').forEach(function (s) { s.style.transform = 'scale(' + k + ')'; }); }
  function mostrar(i) {
    atual = Math.max(0, Math.min(S.length - 1, i));
    document.querySelectorAll('.slide').forEach(function (s, j) { s.classList.toggle('on', j === atual); });
    if (GR[atual + 1] && !feitos[atual + 1]) { feitos[atual + 1] = 1; GR[atual + 1](); }
    document.getElementById('pos').textContent = (atual + 1) + ' / ' + S.length;
    try { history.replaceState(null, '', '#' + (atual + 1)); } catch (e) {}
  }
  document.getElementById('ant').onclick = function () { mostrar(atual - 1); };
  document.getElementById('prox').onclick = function () { mostrar(atual + 1); };
  document.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') { e.preventDefault(); mostrar(atual + 1); }
    if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); mostrar(atual - 1); }
    if (e.key === 'Home') mostrar(0); if (e.key === 'End') mostrar(S.length - 1);
  });
  var x0 = null; palco.addEventListener('touchstart', function (e) { x0 = e.touches[0].clientX; }, {passive: true});
  palco.addEventListener('touchend', function (e) { if (x0 == null) return; var dx = e.changedTouches[0].clientX - x0; if (Math.abs(dx) > 40) mostrar(atual + (dx < 0 ? 1 : -1)); x0 = null; });
  window.addEventListener('beforeprint', function () { Object.keys(GR).forEach(function (k) { if (!feitos[k]) { feitos[k] = 1; document.querySelectorAll('.slide').forEach(function (s) { s.classList.add('on'); }); GR[k](); } }); });
  window.addEventListener('resize', escala);
  escala(); mostrar((parseInt((location.hash || '').slice(1), 10) || 1) - 1);
})();
</script>
