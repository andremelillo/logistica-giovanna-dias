      '<table><tr><th>Produto</th><th class="n">ΣY</th><th class="n">ΣXY</th><th class="n">a</th><th class="n">b</th><th class="n">P(' + PX + ')</th></tr>' +
      P.map(function (p) { return '<tr><td>' + p.ref + '</td><td class="n">' + int(p.mq.sy) + '</td><td class="n">' + int(p.mq.sxy) + '</td><td class="n">' + dec(p.mq.a, 2) + '</td><td class="n">' + dec(p.mq.b, 2) + '</td><td class="n"><b>' + int(p.mq.a + p.mq.b * 12) + '</b></td></tr>'; }).join('') + '</table>' +
      '<p style="font-size:14px;color:var(--mudo)">n = 12 · ΣX = 66 · ΣX² = 506 em todos</p></div>' +
      '<div class="caixa"><h3>' + P1.ref + ': ' + int(P1.mq.sy) + ' = 12a + 66b e ' + int(P1.mq.sxy) + ' = 66a + 506b</h3><div class="graf" style="height:330px"><canvas id="c9"></canvas></div></div></div>'},
    {titulo: 'Comparação da precisão', olho: 'Parte II · Comparação', site: 'fdc-previsao', html:
      '<div class="corpo c2"><div class="caixa" style="padding:12px 16px"><table style="font-size:13px"><tr><th>Produto</th><th>Método</th><th class="n">' + PX + '</th><th class="n">Erro médio</th><th class="n">Erro %</th></tr>' +
      P.map(function (p) { return ks.map(function (k, j) { var r = p.tabela.filter(function (t) { return t.chave === k; })[0]; var m = p.tabela[0].chave === k; return '<tr' + (m ? ' class="m"' : '') + '><td>' + (j === 0 ? '<b>' + p.ref + '</b>' : '') + '</td><td>' + (m ? '✔ ' : '') + CURTO[k] + '</td><td class="n">' + int(r.proximo) + '</td><td class="n">' + int(r.mad) + '</td><td class="n">' + p100(r.mape, 0) + '</td></tr>'; }).join(''); }).join('') + '</table></div>' +
      '<div><div class="caixa"><h3>Erro % médio por método</h3><div class="graf" style="height:300px"><canvas id="c10"></canvas></div></div><p style="font-size:14px;color:var(--mudo);margin:8px 0 0">Erro = |real − previsto|, média de fev/26 a out/26</p></div></div>'},
    {titulo: 'Oscilação e tendência', olho: 'Recomendações', site: 'fdc-conclusao', html:
      '<div class="corpo c2"><div class="caixa"><table><tr><th>Série</th><th class="n">Média/mês</th><th class="n">Coef. variação</th><th class="n">Tendência b</th></tr>' +
      P.map(function (p) { return '<tr><td><b>' + p.ref + '</b></td><td class="n">' + int(p.estat.media) + '</td><td class="n">' + dec(p.estat.cv, 2) + '</td><td class="n">' + (p.mq.b > 0 ? '+' : '') + dec(p.mq.b, 1) + '</td></tr>'; }).join('') +
      FDC.oscilacao.map(function (o) { return '<tr><td>' + esc(o.serie) + '</td><td class="n">' + int(o.media) + '</td><td class="n">' + dec(o.cv, 2) + '</td><td class="n">' + (o.b > 0 ? '+' : '') + int(o.b) + '</td></tr>'; }).join('') + '</table></div>' +
      '<div><ul class="l"><li><b>Oscilação:</b> coeficiente de variação = desvio-padrão ÷ média. Acima de 0,5 a venda oscila muito.</li><li><b>Tendência:</b> o b dos mínimos quadrados (pares a mais ou a menos por mês).</li>' +
      '<li>' + P1.ref + ' cresce; ' + P[1].ref + ' e ' + P[2].ref + ' estão em queda.</li></ul></div></div>'},
    {titulo: 'Recomendações gerenciais', olho: 'Recomendações', site: 'fdc-conclusao', html:
      '<ol class="passos"><li><b>Classe A (' + int(C.A.n) + ' produtos, ' + p100(C.A.valor / T, 0) + ' do valor):</b> controle rígido, previsão revista todo mês e prioridade nas compras de material.</li>' +
      '<li><b>Método por produto:</b> ' + P.map(function (p) { return p.ref + ' → ' + esc(p.tabela[0].metodo).replace(' (tendência linear)', ''); }).join(' · ') + '.</li>' +
      '<li><b>Produtos em queda</b> (' + P[1].ref + ', ' + P[2].ref + '): reduzir a compra de material específico do modelo.</li>' +
      '<li><b>Classe C (' + int(C.C.n) + ' produtos, ' + p100(C.C.valor / T, 0) + ' do valor):</b> controle simples e revisão do mix.</li></ol>'},
    {titulo: 'Questão final e conclusão', olho: 'Conclusão', site: 'fdc-conclusao', html:
      '<div class="corpo c2"><div class="caixa"><h3>Quem merece mais atenção nas compras?</h3><p style="font-size:18px;line-height:1.5;margin:0">Os produtos A com tendência de alta e venda instável, a começar pelo <b>' + P1.ref + '</b>: ' + real(P1.valor) + ' em 12 meses, +' + dec(P1.mq.b, 1) + ' pares por mês e erro de previsão de ' + int(P1.tabela[0].mad) + ' pares. Comprar em lotes menores e rever a previsão todo mês.</p></div>' +
      '<div><ul class="l"><li>A Curva ABC mostra onde concentrar o controle: ' + int(C.A.n) + ' produtos.</li><li>Nenhum método acerta tudo: a venda de moda oscila; usar o de menor erro em cada produto.</li>' +
      '<li>Não calculamos estoque de segurança nem ponto de pedido, como orienta o enunciado.</li></ul></div></div>'}
  ];
  function n(r, v, e) { return '<div><small>' + r + '</small><b>' + v + '</b><span>' + e + '</span></div>'; }

  var palco = document.getElementById('palco'), atual = 0, feitos = {};
  palco.innerHTML = S.map(function (s, i) {
    return '<section class="slide ' + (s.cls || '') + '" id="s' + (i + 1) + '">' + (s.titulo ? '<div class="olho">' + s.olho + '</div><h2>' + s.titulo + '</h2><div style="height:18px"></div>' : '') + s.html +
      '<div class="rodape"><span>Giovanna Dias · Logística Empresarial · FDC</span><span>' + (s.site ? '<a href="index.html#' + s.site + '">Ver no site →</a> · ' : '<a href="index.html">Abrir o site →</a> · ') + (i + 1) + ' / ' + S.length + '</span></div></section>';
  }).join('');

  Chart.defaults.font.family = 'Inter'; Chart.defaults.color = '#5A4A44'; Chart.defaults.animation = false;
  function g(id, cfg) { var el = document.getElementById(id); if (!el) return; cfg.options = Object.assign({responsive: true, maintainAspectRatio: false, plugins: {legend: {labels: {boxWidth: 12}}}}, cfg.options || {}); new Chart(el, cfg); }
  var rotM = FDC.meses.map(mes), rotP = rotM.concat([PX]);
  function linhas(p, chs) { return [{label: 'Real', data: p.real, borderColor: COR.tinta, backgroundColor: COR.tinta, borderWidth: 3, pointRadius: 2, tension: .15}].concat(chs.map(function (k) {
    return {label: FDC.nomes[k], data: p.prev[k], borderColor: CORM2[k], backgroundColor: CORM2[k], borderDash: [6, 4], borderWidth: 2, pointRadius: 0, tension: .15, spanGaps: true}; })); }
  var GR = {
    4: function () { var cc = {A: COR.vinho, B: COR.ocre, C: COR.areia}; g('c4', {type: 'bar', data: {labels: FDC.top.map(function (r) { return r.ref; }), datasets: [
        {type: 'line', label: '% acumulado', data: FDC.top.map(function (r) { return r.acum * 100; }), yAxisID: 'y2', borderColor: COR.tinta, backgroundColor: COR.tinta, borderWidth: 2.5, pointRadius: 2},
        {label: 'Valor (R$)', data: FDC.top.map(function (r) { return r.valor; }), backgroundColor: FDC.top.map(function (r) { return cc[r.classe]; })}]},
        options: {scales: {x: {ticks: {font: {size: 9}}}, y: {ticks: {callback: function (x) { return int(x / 1000) + ' mil'; }}}, y2: {position: 'right', min: 0, max: 100, grid: {display: false}, ticks: {callback: function (x) { return x + '%'; }}}}}});
      g('c4b', {type: 'scatter', data: {datasets: [{label: '% acumulado', data: [{x: 0, y: 0}].concat(FDC.curva.map(function (p) { return {x: p[0], y: p[1] * 100}; })), showLine: true, borderColor: COR.vinho, pointRadius: 0, borderWidth: 2.5}]},
        options: {plugins: {legend: {display: false}}, scales: {x: {type: 'linear', min: 0, max: N, title: {display: true, text: 'ordem do produto'}}, y: {min: 0, max: 100, ticks: {callback: function (x) { return x + '%'; }}}}}}); },
    5: function () { g('c5', {type: 'bar', data: {labels: FDC.categorias.map(function (c) { return c.cat; }), datasets: [{data: FDC.categorias.map(function (c) { return c.valor; }), backgroundColor: COR.vinho}]},
      options: {plugins: {legend: {display: false}}, scales: {y: {ticks: {callback: function (x) { return 'R$ ' + dec(x / 1e6, 0) + ' mi'; }}}}}}); },
    6: function () { var cs = [COR.vinho, COR.ocre, COR.azul]; g('c6', {type: 'line', data: {labels: rotM, datasets: P.map(function (p, i) { return {label: p.ref, data: p.real, borderColor: cs[i], backgroundColor: cs[i], borderWidth: 2.5, pointRadius: 3, tension: .15}; })}}); },
    8: function () { g('c8', {type: 'line', data: {labels: rotP, datasets: linhas(P1, ['ses1', 'ses2'])}}); },
    9: function () { g('c9', {type: 'line', data: {labels: rotP, datasets: linhas(P1, ['mq'])}}); },
    10: function () { var cs = [COR.vinho, COR.ocre, COR.azul]; g('c10', {type: 'bar', data: {labels: ks.map(function (k) { return CURTO[k]; }),
      datasets: P.map(function (p, i) { return {label: p.ref, backgroundColor: cs[i], data: ks.map(function (k) { return p.tabela.filter(function (t) { return t.chave === k; })[0].mape * 100; })}; })},
      options: {scales: {x: {ticks: {font: {size: 10}}}, y: {ticks: {callback: function (x) { return x + '%'; }}}}}}); }
  };
  function escala() { var k = Math.min(window.innerWidth / 1280, (window.innerHeight - 56) / 720); document.querySelectorAll('.slide').forEach(function (s) { s.style.transform = 'scale(' + k + ')'; }); }
  function mostrar(i) {
    atual = Math.max(0, Math.min(S.length - 1, i));
    document.querySelectorAll('.slide').forEach(function (s, j) { s.classList.toggle('on', j === atual); });
    if (GR[atual + 1] && !feitos[atual + 1]) { feitos[atual + 1] = 1; GR[atual + 1](); }
    document.getElementById('pos').textContent = (atual + 1) + ' / ' + S.length;
    try { history.replaceState(null, '', '#' + (atual + 1)); } catch (e) {}
  }
  document.getElementById('ant').onclick = function () { mostrar(atual - 1); };
  document.getElementById('prox').onclick = function () { mostrar(atual + 1); };
  document.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') { e.preventDefault(); mostrar(atual + 1); }
    if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); mostrar(atual - 1); }
    if (e.key === 'Home') mostrar(0); if (e.key === 'End') mostrar(S.length - 1);
  });
  var x0 = null; palco.addEventListener('touchstart', function (e) { x0 = e.touches[0].clientX; }, {passive: true});
  palco.addEventListener('touchend', function (e) { if (x0 == null) return; var dx = e.changedTouches[0].clientX - x0; if (Math.abs(dx) > 40) mostrar(atual + (dx < 0 ? 1 : -1)); x0 = null; });
  window.addEventListener('beforeprint', function () { Object.keys(GR).forEach(function (k) { if (!feitos[k]) { feitos[k] = 1; document.querySelectorAll('.slide').forEach(function (s) { s.classList.add('on'); }); GR[k](); } }); });
  window.addEventListener('resize', escala);
  escala(); mostrar((parseInt((location.hash || '').slice(1), 10) || 1) - 1);
})();
</script>
